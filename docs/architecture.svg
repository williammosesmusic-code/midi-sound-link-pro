<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">MIDI Drum Pad Prototype architecture</title>
  <desc id="desc">A diagram showing MIDI controller input flowing through Web MIDI, React state, patch mapping, and Web Audio output, with local storage supporting kits and mappings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#09090b"/><stop offset="1" stop-color="#172033"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#0369a1"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop stop-color="#047857"/><stop offset="1" stop-color="#10b981"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/></marker>
    <style>
      .box{fill:#18181b;stroke:#3f3f46;stroke-width:2}.blue{fill:url(#blue);stroke:#7dd3fc}.green{fill:url(#green);stroke:#6ee7b7}.store{fill:#292524;stroke:#fbbf24}.title{font:700 24px system-ui,sans-serif;fill:#f4f4f5}.label{font:600 17px system-ui,sans-serif;fill:#f4f4f5}.small{font:13px system-ui,sans-serif;fill:#d4d4d8}.line{stroke:#7dd3fc;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text x="60" y="64" class="title">MIDI Drum Pad Prototype · End-to-End Architecture</text>
  <text x="60" y="92" class="small">Browser-first MIDI mapping, kit state, and Web Audio playback</text>

  <rect x="70" y="160" width="210" height="130" rx="18" class="blue" filter="url(#shadow)"/>
  <text x="175" y="210" text-anchor="middle" class="label">MIDI Controller</text>
  <text x="175" y="238" text-anchor="middle" class="small">Pads, keys, knobs</text>
  <text x="175" y="262" text-anchor="middle" class="small">Note + channel + velocity</text>

  <rect x="350" y="160" width="220" height="130" rx="18" class="box" filter="url(#shadow)"/>
  <text x="460" y="210" text-anchor="middle" class="label">Web MIDI API</text>
  <text x="460" y="238" text-anchor="middle" class="small">Permission + input listener</text>
  <text x="460" y="262" text-anchor="middle" class="small">Reconnect handling</text>

  <rect x="640" y="140" width="240" height="170" rx="18" class="box" filter="url(#shadow)"/>
  <text x="760" y="190" text-anchor="middle" class="label">React interaction state</text>
  <text x="760" y="220" text-anchor="middle" class="small">useMidi + usePatches</text>
  <text x="760" y="246" text-anchor="middle" class="small">Learn target + conflicts</text>
  <text x="760" y="272" text-anchor="middle" class="small">Patch lookup + highlights</text>

  <rect x="950" y="140" width="180" height="170" rx="18" class="store" filter="url(#shadow)"/>
  <text x="1040" y="190" text-anchor="middle" class="label">Local storage</text>
  <text x="1040" y="220" text-anchor="middle" class="small">10 kits</text>
  <text x="1040" y="246" text-anchor="middle" class="small">16 patches/kit</text>
  <text x="1040" y="272" text-anchor="middle" class="small">Selected kit</text>

  <path d="M280 225 H350" class="line"/><path d="M570 225 H640" class="line"/><path d="M880 225 H950" class="line"/>

  <rect x="160" y="440" width="270" height="150" rx="18" class="box" filter="url(#shadow)"/>
  <text x="295" y="490" text-anchor="middle" class="label">Patch grid and dialogs</text>
  <text x="295" y="520" text-anchor="middle" class="small">Learn · Edit · Clear · Preview</text>
  <text x="295" y="546" text-anchor="middle" class="small">Kit selector + monitor</text>
  <text x="295" y="572" text-anchor="middle" class="small">JSON export/import</text>

  <rect x="540" y="420" width="270" height="190" rx="18" class="green" filter="url(#shadow)"/>
  <text x="675" y="470" text-anchor="middle" class="label">AudioEngine</text>
  <text x="675" y="500" text-anchor="middle" class="small">AudioContext + master gain</text>
  <text x="675" y="526" text-anchor="middle" class="small">Synth drum voices</text>
  <text x="675" y="552" text-anchor="middle" class="small">Decoded sample cache</text>
  <text x="675" y="578" text-anchor="middle" class="small">One-shot + hold release</text>

  <rect x="920" y="440" width="190" height="150" rx="18" class="box" filter="url(#shadow)"/>
  <text x="1015" y="490" text-anchor="middle" class="label">Browser output</text>
  <text x="1015" y="520" text-anchor="middle" class="small">Speakers / headphones</text>
  <text x="1015" y="546" text-anchor="middle" class="small">Velocity-aware sound</text>
  <text x="1015" y="572" text-anchor="middle" class="small">Low setup friction</text>

  <path d="M760 310 C760 365 675 365 675 420" class="line"/>
  <path d="M640 285 C540 350 430 380 295 440" class="line"/>
  <path d="M430 515 H540" class="line"/>
  <path d="M810 515 H920" class="line"/>
  <path d="M1040 310 V380 H1040 V440" class="line"/>

  <text x="60" y="700" class="small">Data stays local in the current prototype; cloud sync and hosted sample storage are future business opportunities.</text>
</svg>
